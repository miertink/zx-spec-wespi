<!DOCTYPE html>
<html lang="{{LANG_TAG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZX-Spec Wespi</title>
<style>
:root{--bg:#0d0e12;--card:#171920;--card2:#1f222b;--line:#2b2f3b;--fg:#ececf1;--dim:#9497a6;
--red:#e4002b;--yel:#ffcd00;--grn:#00a651;--cya:#00a9e0;--r:12px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--cya);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);
gap:16px 24px;align-items:center;padding:18px 18px 24px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.stripes{position:absolute;left:0;right:0;bottom:0;height:5px;pointer-events:none;
background:linear-gradient(90deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--grn) 50% 75%,var(--cya) 75%)}
/* the logo (a cassette, 316:201) and the tape deck: the same height */
.brandbox,.deck{height:200px}
.brandbox{display:flex;aspect-ratio:316/201;min-width:0}
.logo{display:flex;width:100%;height:100%}.logo img,.logo svg{width:100%;height:100%;display:block;object-fit:contain}
.reel{transform-box:fill-box;transform-origin:50% 50%}.spin .reel{animation:reel 1.4s linear infinite}
@keyframes reel{to{transform:rotate(-360deg)}}
.deck{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;background:var(--card2);border:1px solid var(--line);
border-radius:var(--r);padding:12px 14px;font-size:14px}
.deck .l1{display:flex;align-items:flex-start;gap:8px;min-width:0}.deck .l1 .dot{margin-top:5px}
.deck .t,.deck .l2,.deck .l3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.deck .l2{font-size:13px}.deck .l3{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.9em}.deck .l3{color:var(--dim);font-size:12px}
.deck .bar{margin:2px 0}.deck .bar div{transition:width 1.9s linear}
.deck .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--dim)}
.dot.play{background:var(--grn);box-shadow:0 0 8px var(--grn)}.dot.rec{background:var(--red);box-shadow:0 0 8px var(--red)}.dot.loop{background:var(--yel);box-shadow:0 0 8px var(--yel)}
.card{margin-top:16px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card h2{margin:0 0 12px;font-size:16px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.btn{display:inline-block;font:inherit;font-size:13px;color:var(--fg);background:var(--card2);
border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.go{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.warn:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
input[type=text]{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);
border-radius:8px;padding:6px 9px;min-width:0}
form{display:inline;margin:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;
padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card2)}
.fname{font-family:ui-monospace,Consolas,monospace;font-size:14px;word-break:break-all}
.ititle{display:block;color:var(--dim);font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;color:#111}
.b-tap{background:var(--cya)}.b-tzx{background:var(--yel)}.b-pzx{background:var(--grn)}.b-csw{background:var(--red);color:#fff}.b-other{background:var(--line);color:var(--fg)}
.num{text-align:right;white-space:nowrap;color:var(--dim)}
.acts{white-space:nowrap;text-align:right}.acts>*{margin-left:4px}
details.ren{display:inline-block;position:relative}
details.ren summary{list-style:none}details.ren summary::-webkit-details-marker{display:none}
details.ren .pop{position:absolute;right:0;top:34px;z-index:5;display:flex;gap:6px;padding:10px;
background:var(--card2);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0008}
.up{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.up input[type=text]{flex:1 1 200px}
.up input[type=file]{flex:1 1 240px;min-width:0;color:var(--dim);font-size:13px}
input[type=file]::file-selector-button{font:inherit;font-size:13px;color:var(--fg);background:var(--card2);
border:1px solid var(--line);border-radius:8px;padding:5px 11px;margin-right:10px;cursor:pointer}
progress{width:100%;height:6px;margin-top:10px;accent-color:var(--grn);display:none}
.upmsg{margin-top:6px;color:var(--dim);font-size:12px;min-height:1em}.upmsg.err{color:#ff8a8a}
input[type=text]:disabled{opacity:.6}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0}
.bar div{height:100%;background:linear-gradient(90deg,var(--grn),var(--cya))}
.flags{display:flex;gap:7px;align-items:center}.flags a{display:block;line-height:0;opacity:.3;transition:opacity .2s}
.flags a:hover{opacity:.7}.flags a.on{opacity:.85}
.flags svg{width:18px;height:12px;display:block;border-radius:1px}
footer{margin:16px 2px;color:var(--dim);font-size:12px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
details.sys summary,details.diag summary{cursor:pointer;color:var(--dim);font-size:13px}
.empty{color:var(--dim);text-align:center;padding:24px}
@media (max-width:640px){.wrap{padding:10px}header{grid-template-columns:minmax(0,1fr);padding:12px 12px 20px}
.brandbox{height:auto;width:100%;max-width:360px;justify-self:center}.deck{height:auto;min-height:150px;padding:10px 12px}
.hide-s,thead{display:none}.up>*{flex:1 1 100%}
table,tbody,tr,td{display:block;width:100%}tr{padding:8px 0;border-bottom:1px solid var(--line)}tr:last-child{border-bottom:0}
td{border:0;padding:3px 4px}.acts{text-align:left;white-space:normal}.acts>*{margin:4px 4px 0 0}
details.ren .pop{left:0;right:auto}}
</style>
</head>
<body><div class="wrap">
